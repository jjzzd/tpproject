model:
  vocab_size: 260
  num_layers: 4
  hidden_size: 256
  num_attention_heads: 8
  intermediate_size: 768
  max_text_length: 128
  max_images: 2
  image_size: 64
  patch_size: 16
  dropout: 0.0
data:
  mode: synthetic
  path: data/raw/train.jsonl
  image_root: data/raw
  samples: 1024
  num_workers: 0
parallel:
  strategy: single
  tensor_parallel: 1
  pipeline_parallel: 1
  data_parallel_shard: 1
  pipeline_microbatches: 4
optimizer:
  type: fused_adamw
  lr: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
training:
  output_dir: runs/single
  seed: 42
  steps: 20
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  dtype: bfloat16
  activation_checkpointing: true
  grad_clip: 1.0
  log_interval: 1
  checkpoint_interval: 0
  compile: false

