[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a100-multimodal-training"
version = "0.1.0"
description = "Two-GPU multimodal training starter with TP, PP, FSDP2, SDPA and memory optimizations"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
lowbit = ["torchao>=0.8"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

